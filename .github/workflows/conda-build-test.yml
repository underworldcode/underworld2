name: Pixi Build & Test

on:
  push:
    branches:
      - main
      - development
      - v2.*
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  test:
    runs-on: [ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: latest
          environments: default
          cache: true

      - name: Build Underworld2
        run: pixi run build

      - name: Run tests
        run: pixi run test
