name: Pixi Build & Test

on:
  push:
    branches:
      - main
      - development
      - v2.*
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  test:
    runs-on: [ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: latest
          environments: default
          cache: true

      - name: Install coupling dependencies
        run: |
          pixi install --environment default --feature coupling
          pixi run --environment default --feature coupling pip install --no-build-isolation "git+https://github.com/kinnala/meshplex.git"

      - name: Build Underworld2
        run: pixi run build

      # disable ucx mpi comms as github runners can't run them
      - name: Run tests
        run: |
          OMPI_MCA_pml=^ucx pixi run test
