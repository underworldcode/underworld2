name: Publish Python distribution to TestPyPI then PyPI

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release name"
        required: true
        type: string
  release:
    types: [published]

jobs:
  build_uw:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
    - name: Checkout release
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Set up Pixi
      uses: prefix-dev/setup-pixi@v0
      with:
        pixi-version: latest
        environments: default
        cache: true

    - name: Build source distribution
      run: |
        pixi run pip install build
        python3 -m build --sdist

    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: underworld-${{ github.event.release.name }}
        path: dist/

  publish_testpypi:
    name: Publish to TestPyPI
    needs: build_uw
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/underworld
    permissions:
      id-token: write

    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: underworld-${{ github.event.release.name }}
          path: dist/

      - name: Push to testPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish_pypi:
    name: Publish to PyPI
    needs: publish_testpypi
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/underworld
    permissions:
      id-token: write

    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: underworld-${{ github.event.release.name }}
          path: dist/

      - name: Push to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
