[workspace]
name = "underworld2"
version = "2.0.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

# ── Runtime dependencies (present in both environments) ───────────────────────
[dependencies]
python           = "3.12.*"
numpy            = "<2"
pint             = ">=0.24.4,<0.25"
scipy            = ">=1.16.0,<2"
mpi4py           = ">=4.1.0,<5"
libxml2          = ">=2.13.8,<3"
mpich            = ">=4.3.1,<5"
hdf5             = {version = "*", build = "mpi*"}
h5py             = {version = "*", build = "mpi*"}
petsc            = "3.21.*"
mesalib          = ">=25.0.5,<26"
matplotlib       = ">=3.10.5,<4"
jupyterlab       = ">=4.4.4,<5"
jupyterhub-singleuser = ">=5.0.0"
pip              = ">=25.1.1,<26"

# ── Build-only dependencies (only in the 'default' environment) ───────────────
[feature.build.dependencies]
cmake            = ">=4.0.3,<5"
swig             = ">=4"
pkg-config       = ">=0.29.2,<0.30"
compilers        = ">=1.10.0,<2"
c-compiler       = "*"
cxx-compiler     = "*"
ninja            = ">=1.13.0,<2"
make             = "*"
libxml2-devel    = ">=2.13.8,<3"
git              = ">=2.40.0"
git-lfs          = ">=3.0.0"
pytest           = ">=8.4.1,<9"
nbmake           = ">=1.5.5,<2"
jupytext         = ">=1.17.2,<2"

# ── Pip packages that require compilers at install time ───────────────────────
# These are built to wheels in the container's build stage and reinstalled
# into the runtime stage without needing compilers there.
# meshplex is installed directly from GitHub in the Containerfile (git URL is
# not used here to keep the pixi solve portable across platforms).
[feature.build.pypi-dependencies]
lavavu  = "*"
badlands = "*"

# ── Named environments ────────────────────────────────────────────────────────
# 'default'  – runtime + build deps; used for local development and the
#              container build stage.
# 'runtime'  – runtime deps only; used as the lean container runtime stage.
[environments]
default = {features = ["build"], solve-group = "main"}
runtime = {features = [],        solve-group = "main"}

# ── Common tasks ──────────────────────────────────────────────────────────────
[tasks]
build = {cmd = "pip install --no-build-isolation -ve .", description = "Build and install the C/C++ extension in editable mode"}
test  = {cmd = "pytest -x --nbmake --nbmake-kernel=python3 docs/tests/", description = "Run the test suite"}
